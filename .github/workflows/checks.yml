name: Website checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:product-unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: |
          npm run start > /tmp/sorp-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/sorp-journey.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  research-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONSOLE_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/postgres
      ADMIN_EMAIL: owner@example.invalid
      SORP_BACKEND_ORIGIN: http://127.0.0.1:4319
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/console-auth-fixture.mjs > /tmp/console-auth.log 2>&1 &
          npm run start > /tmp/console-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/console/login/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/console-flow.mjs
      - run: NODE_OPTIONS=--conditions=react-server npx tsx tests/console-full-backup.integration.test.ts
      - run: NODE_OPTIONS=--conditions=react-server npx tsx tests/console-discovery-flow.ts
  independent-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sorp_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SORP_AUTH_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/sorp_test
      SORP_AUTH_SECRET: synthetic-ci-secret-at-least-thirty-two-characters
      SORP_AUTH_BASE_URL: http://localhost:3000
      RESEND_API_KEY: synthetic-ci-key
      NODE_OPTIONS: --conditions=react-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --input-type=module -e 'import {Pool} from "pg"; import {readFileSync} from "node:fs"; const db=new Pool({connectionString:process.env.SORP_AUTH_DATABASE_URL}); for(const file of ["008_sorp_auth_provider.sql","009_sorp_auth_application.sql","010_sorp_report_ownership.sql","011_sorp_auth_audit_integrity.sql","012_sorp_excellence_access.sql"]) await db.query(readFileSync(`migrations/${file}`,"utf8")); await db.query("CREATE ROLE sorp_auth_runtime LOGIN"); await db.query(readFileSync("scripts/provision-sorp-auth-runtime.sql","utf8")); await db.end()'
      - run: npx tsx --test tests/sorp-auth-role.integration.test.ts
      - run: npx tsx --test tests/sorp-auth-email.test.ts tests/sorp-auth-export.test.ts tests/sorp-auth-security.integration.test.ts tests/sorp-auth.integration.test.ts tests/sorp-reconciliation.integration.test.ts tests/sorp-report-upload.integration.test.ts
        env:
          SORP_AUTH_DATABASE_URL: postgresql://sorp_auth_runtime@127.0.0.1:55432/sorp_test
