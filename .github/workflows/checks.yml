name: Website checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - run: STATIC_EXPORT=true SITE_LIVE=false npm run build
      - run: cp deploy/ionos-preview.htaccess out/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: ionos-preview-site
          path: out/
          include-hidden-files: true
          retention-days: 14
